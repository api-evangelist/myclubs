name: Myclubs
description: >-
  Myclubs is a Vienna- and Zurich-based digital sports membership company,
  founded in 2014 by Tobias Homberger, that gives members flexible access to a
  network of more than 1,200 sports and fitness providers across Austria and
  Switzerland through a single subscription. One membership covers over 35 sport
  and activity types and more than 10,000 bookable workouts per week, from gyms
  and yoga studios to tennis, boxing and cross training. Myclubs also runs a
  corporate fitness program used by over 300 employers as an employee benefit.
  The company was acquired by Urban Sports Club in August 2024 and is a portfolio
  company of Speedinvest. Myclubs is a consumer-facing membership brand and does
  not publish a public developer portal, API documentation, or machine-readable
  API specification.
